name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack mod source
        run: |
          echo "" | base64 -d | tar xz
          ls -R src | head -50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: elytrapose-jar
          path: build/libs/*.jar
